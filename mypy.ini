# Type gate for `make typecheck` (mypy fde).
# Three files with real type debt are byte-pinned by the M008 v4 registration:
# editing them would break `registry.py status M008`, so their known error codes are
# scoped HERE instead of in source. Every [mypy-X] override is asserted to resolve to
# exactly one FROZEN file by fde/tests/test_repo_hygiene.py — a scope over a free file
# fails the suite. Scopes shrink when M009 re-freezes these files.
[mypy]
python_version = 3.12
show_error_codes = True

[mypy-report]
disable_error_code = assignment, var-annotated

[mypy-inspect_run]
disable_error_code = assignment

[mypy-test_m008_hardening]
disable_error_code = var-annotated
